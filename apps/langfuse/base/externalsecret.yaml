apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: postgres
        property: LANGFUSE_PASSWORD
    - secretKey: nextauth-secret
      remoteRef:
        key: langfuse
        property: nextauth-secret
    - secretKey: salt
      remoteRef:
        key: langfuse
        property: salt
    - secretKey: encryption-key
      remoteRef:
        key: langfuse
        property: encryption-key
    - secretKey: clickhouse-password
      remoteRef:
        key: langfuse
        property: clickhouse-password
    - secretKey: redis-password
      remoteRef:
        key: langfuse
        property: redis-password
    - secretKey: s3-access-key
      remoteRef:
        key: minio
        property: root_user
    - secretKey: s3-secret-key
      remoteRef:
        key: minio
        property: root_password
