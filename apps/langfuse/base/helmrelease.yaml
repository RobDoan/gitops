apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 1h
  chart:
    spec:
      chart: langfuse
      version: 1.5.27
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    postgresql:
      deploy: false
      host: postgres-postgresql.postgres.svc.cluster.local
      port: 5432
      auth:
        username: royal
        database: langfuse
    s3:
      deploy: false
      bucket: langfuse
      region: us-east-1
      endpoint: http://minio.minio.svc.cluster.local:9000
      forcePathStyle: true
    nextauth:
      url: https://langfuse-home.quybits.com
    # Clickhouse and Redis are enabled by default in the chart if not explicitly disabled.
    # We leave them as is or disable if they cause issues.
  valuesFrom:
    - kind: Secret
      name: langfuse-secrets
      valuesKey: db-password
      targetPath: postgresql.auth.password
    - kind: Secret
      name: langfuse-secrets
      valuesKey: nextauth-secret
      targetPath: nextauth.secret
    - kind: Secret
      name: langfuse-secrets
      valuesKey: salt
      targetPath: langfuse.salt
    - kind: Secret
      name: langfuse-secrets
      valuesKey: encryption-key
      targetPath: langfuse.encryptionKey
    - kind: Secret
      name: langfuse-secrets
      valuesKey: s3-access-key
      targetPath: s3.accessKeyId
    - kind: Secret
      name: langfuse-secrets
      valuesKey: s3-secret-key
      targetPath: s3.secretAccessKey
