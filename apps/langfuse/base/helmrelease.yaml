apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 1h
  chart:
    spec:
      chart: langfuse
      version: 1.5.27
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    postgresql:
      deploy: false
      host: postgres-postgresql.postgres.svc.cluster.local
      port: 5432
      auth:
        username: langfuse
        database: langfuse
        existingSecret: langfuse-secrets
        secretKeys:
          userPasswordKey: db-password
    s3:
      deploy: false
      bucket: langfuse
      region: us-east-1
      endpoint: http://minio.minio.svc.cluster.local:9000
      forcePathStyle: true
      accessKeyId:
        secretKeyRef:
          name: langfuse-secrets
          key: s3-access-key
      secretAccessKey:
        secretKeyRef:
          name: langfuse-secrets
          key: s3-secret-key
    langfuse:
      nextauth:
        url: https://langfuse-home.quybits.com
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth-secret
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt
      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption-key
    clickhouse:
      auth:
        existingSecret: langfuse-secrets
        existingSecretKey: clickhouse-password
      # ClickHouse's own diagnostic log tables ship without a TTL and grew to
      # ~7.5GB per replica on local-path (no quota) before anyone noticed.
      extraOverrides: |
        <clickhouse>
          <trace_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></trace_log>
          <metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></metric_log>
          <asynchronous_metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></asynchronous_metric_log>
          <text_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></text_log>
          <latency_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></latency_log>
          <query_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_log>
          <part_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></part_log>
        </clickhouse>
    redis:
      auth:
        existingSecret: langfuse-secrets
        existingSecretPasswordKey: redis-password
