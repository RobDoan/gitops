apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: app.postgres
      rules:
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Postgres is DOWN"
            description: |
              prometheus-postgres-exporter reports pg_up=0. The timescaledb-0 pod may be
              OOMKilled, unschedulable, or the exporter cannot connect. Check:
              kubectl -n postgres get pod timescaledb-0
              kubectl -n postgres logs timescaledb-0 --tail=50
    - name: app.postgres-backup
      rules:
        - alert: PostgresBackupFailed
          expr: |
            sum(
              kube_job_status_failed{namespace="postgres",job_name=~"timescaledb-backup.*"}
              * on(namespace, job_name) group_left()
              ((time() - kube_job_created{namespace="postgres",job_name=~"timescaledb-backup.*"}) < bool 86400)
            ) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Postgres nightly backup FAILED"
            description: |
              A Job from CronJob postgres/timescaledb-backup failed in the last 24h: the dump,
              the MinIO upload or the S3 upload. Check:
              kubectl -n postgres get jobs
              kubectl -n postgres logs job/<job-name> -c dump
              kubectl -n postgres logs job/<job-name> -c upload
        - alert: PostgresBackupMissing
          expr: time() - kube_cronjob_status_last_successful_time{namespace="postgres",cronjob="timescaledb-backup"} > 93600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "No successful Postgres backup in 26h"
            description: |
              CronJob postgres/timescaledb-backup has not completed successfully in 26 hours.
              Check whether it ran at all, and why it failed:
              kubectl -n postgres get cronjob timescaledb-backup
              kubectl -n postgres get jobs
        - alert: PostgresBackupMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="postgres",cronjob="timescaledb-backup"})
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "Postgres backup has never succeeded"
            description: |
              CronJob postgres/timescaledb-backup has no successful run on record for 26 hours
              (or kube-state-metrics stopped reporting it). Check:
              kubectl -n postgres get cronjob timescaledb-backup
              kubectl -n postgres get jobs
    - name: app.backend
      rules:
        - alert: BackendHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, handler) (
                rate(http_request_duration_seconds_bucket{job="backend",handler="/story"}[5m])
              )
            ) > 2
          for: 10m
          labels:
            severity: warning
            service: backend
          annotations:
            summary: "Backend /story p95 latency > 2s for 10m"
            description: |
              p95 latency on POST /story has been above 2s for 10m.
              Likely source files: backend/graph.py (LangGraph pipeline),
              backend/nodes/generate_story.py, backend/utils/elevenlabs.py.
              Correlate with: histogram_quantile(0.95, sum by (le, node) (rate(royal_langgraph_node_duration_seconds_bucket[5m]))).
              Check pod logs: {namespace="royal-dispatch", pod=~"backend-.*"}.
        - alert: BackendExternalApiErrors
          expr: sum by (provider) (rate(royal_external_api_calls_total{outcome="error"}[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
            service: backend
          annotations:
            summary: "Backend external API {{ $labels.provider }} error rate > 0.1/s"
            description: |
              royal_external_api_calls_total{provider="{{ $labels.provider }}",outcome="error"} is
              elevated. Likely source file: backend/services/elevenlabs_convai.py or the LangChain
              wrapper in backend/nodes/generate_story.py (for provider="anthropic"), or
              backend/utils/mem0_client.py (for provider="mem0"). Cross-reference logs:
              {namespace="royal-dispatch", pod=~"backend-.*"} |~ "(?i){{ $labels.provider }}".
