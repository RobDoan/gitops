apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: royal-dispatch
  namespace: monitoring
  labels:
    alertmanagerConfig: royal-dispatch
spec:
  route:
    receiver: slack-default
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Watchdog is the chart's dead-man's-switch — always firing by design.
      # Stream it to healthchecks.io as a heartbeat; if pings stop for >1h,
      # healthchecks pages us in #healthcheck-io-alert (Alertmanager itself
      # is down, so its own alerts can't reach us).
      - receiver: healthchecks-watchdog
        matchers:
          - name: alertname
            value: Watchdog
        groupWait: 0s
        groupInterval: 5m
        repeatInterval: 5m
      - receiver: slack-critical
        matchers:
          - name: severity
            value: critical
  receivers:
    - name: "null"
    - name: healthchecks-watchdog
      webhookConfigs:
        - urlSecret:
            name: alertmanager-healthchecks
            key: watchdog_url
          sendResolved: false
    - name: slack-default
      slackConfigs:
        - apiURL:
            name: alertmanager-slack
            key: default
          channel: "#alerts"
          sendResolved: true
          title: "{{ .CommonLabels.alertname }} — {{ .CommonLabels.severity }}"
          text: |-
            {{ range .Alerts }}• *{{ .Annotations.summary }}*
            {{ .Annotations.description }}
            {{ end }}
    - name: slack-critical
      slackConfigs:
        - apiURL:
            name: alertmanager-slack
            key: critical
          channel: "#alerts-critical"
          sendResolved: true
          title: "[CRITICAL] {{ .CommonLabels.alertname }}"
          text: |-
            {{ range .Alerts }}• *{{ .Annotations.summary }}*
            {{ .Annotations.description }}
            {{ end }}
