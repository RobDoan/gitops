apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-healthchecks
    creationPolicy: Owner
  data:
    - secretKey: watchdog_url
      remoteRef:
        key: observability/healthchecks
        property: watchdog_url
