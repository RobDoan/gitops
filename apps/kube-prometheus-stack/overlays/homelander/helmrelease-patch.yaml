apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    alertmanager:
      alertmanagerSpec:
        externalUrl: https://alertmanager.homelander.local
    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.homelander.local
    # K3s embeds these in the k3s-server process — no separate scrape targets.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
