apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    alertmanager:
      alertmanagerSpec:
        externalUrl: https://alertmanager.homelander.local
    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.homelander.local
