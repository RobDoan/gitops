name: Sync main to RobDoan/gitops

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configure SSH for target repo
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync source tree onto target main
        run: |
          git remote add target git@github.com:RobDoan/gitops.git

          if git fetch target main 2>/dev/null; then
            git checkout -B sync-target target/main
          else
            echo "Target main does not exist yet — creating orphan branch."
            git checkout --orphan sync-target
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          git read-tree --reset -u origin/main

          git rm -rf --ignore-unmatch \
            .agents .claude .cursor \
            docs/specs docs/superpowers docs/blog docs/personal \
            CLAUDE.md GEMINI.md AGENTS.md opencode.json skills-lock.json

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "${{ github.event.pull_request.title }}"
          git push target sync-target:main
