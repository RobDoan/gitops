apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  values:
    server:
      # Pin the Vault image. The chart version range (>=0.27.0 <1.0.0) in base
      # otherwise drifts the default image to a new major (1.21.2 -> 2.0.2),
      # which OnDelete leaves as an undeployed pending update. Pin to the running
      # 1.21.2 until a 2.x upgrade is planned (raft/storage breaking changes).
      image:
        repository: hashicorp/vault
        tag: "1.21.2"
      dataStorage:
        storageClass: local-path
