# Nightly logical backup of every database on timescaledb-0, to MinIO (14 days) and
# AWS S3 (30 days). 00:30 UTC-7: after the day's human input, before PWM's 01:30 run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: timescaledb-backup
  namespace: postgres
  labels:
    app.kubernetes.io/name: timescaledb-backup
spec:
  schedule: "30 0 * * *"
  timeZone: America/Phoenix
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: timescaledb-backup
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: timescale/timescaledb:2.32.0-pg18
              command: ["sh", "/scripts/dump.sh"]
              env:
                - name: PGHOST
                  value: timescaledb.postgres.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-secrets
                      key: postgres-password
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          containers:
            - name: upload
              image: amazon/aws-cli:2.39.4
              command: ["sh", "/scripts/upload.sh"]
              envFrom:
                - secretRef:
                    name: timescaledb-backup
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 20Gi
            - name: scripts
              configMap:
                name: timescaledb-backup-scripts
