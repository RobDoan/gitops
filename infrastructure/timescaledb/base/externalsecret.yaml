# Superuser password for timescaledb-0. Reuses the Bitnami release's Vault key, so the
# `postgres` role password is the same on both servers during the migration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timescaledb-secrets
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: timescaledb-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgres
        property: postgres_password
