# Credentials for the nightly backup's upload step: MinIO user postgres-backup and the
# upload-only AWS IAM user homelander-pg-backup. Written by scripts/timescaledb-bootstrap.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timescaledb-backup
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: timescaledb-backup
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: postgres-backup
        property: minio_access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: postgres-backup
        property: minio_secret_key
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: postgres-backup
        property: aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: postgres-backup
        property: aws_secret_access_key
    - secretKey: S3_BUCKET
      remoteRef:
        key: postgres-backup
        property: aws_bucket
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: postgres-backup
        property: aws_region
