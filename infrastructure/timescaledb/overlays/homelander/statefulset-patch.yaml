# local-path binds the volume to the node it first lands on, so this pins where the data lives.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: postgres
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: karen
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
