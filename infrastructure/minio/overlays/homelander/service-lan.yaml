# MinIO S3 API for MacBook clients (PWM, pwm-technical), via k3s ServiceLB on every
# node IP and on jarvis's Tailscale IP 100.89.244.65. Home LAN and tailnet only.
# Lives here rather than in the HelmRelease, which is left untouched.
apiVersion: v1
kind: Service
metadata:
  name: minio-lan
  namespace: minio
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 192.168.1.0/24
    - 100.64.0.0/10
  selector:
    app: minio
    release: minio
  ports:
    - name: http
      port: 9000
      targetPort: 9000
